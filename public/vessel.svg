<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Card poster for the Research Vessel Viewer — replace with a real
       screenshot of https://research-vessel-viewer.vercel.app/ anytime -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1e33"/>
      <stop offset="1" stop-color="#12324f"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2a44"/>
      <stop offset="0.5" stop-color="#03182e"/>
      <stop offset="1" stop-color="#010810"/>
    </linearGradient>
  </defs>

  <!-- Sky and ocean -->
  <rect width="400" height="110" fill="url(#sky)"/>
  <rect y="110" width="400" height="190" fill="url(#sea)"/>
  <rect y="108" width="400" height="4" fill="#1d4e73" opacity="0.9"/>

  <!-- God-ray light shafts -->
  <g fill="#7fc8e8" opacity="0.10">
    <polygon points="90,112 110,112 140,300 100,300"/>
    <polygon points="210,112 224,112 260,300 230,300"/>
    <polygon points="300,112 312,112 350,300 320,300"/>
  </g>

  <!-- Vessel silhouette -->
  <g fill="#dbe6ee">
    <path d="M120 108 L280 108 L268 90 L140 90 Z"/>
    <rect x="176" y="66" width="52" height="26" rx="2"/>
    <rect x="196" y="44" width="5" height="24"/>
    <rect x="232" y="58" width="26" height="32"/>
  </g>
  <path d="M120 108 L280 108 L272 122 L132 122 Z" fill="#8c1d2c"/>

  <!-- Hull below waterline -->
  <path d="M132 122 L272 122 L252 138 L156 138 Z" fill="#5e1220" opacity="0.85"/>

  <!-- Fish school -->
  <g fill="#9fd4ec" opacity="0.85">
    <ellipse cx="86" cy="190" rx="7" ry="2.4"/>
    <ellipse cx="103" cy="182" rx="6" ry="2.1"/>
    <ellipse cx="98" cy="199" rx="6" ry="2.1"/>
    <ellipse cx="118" cy="191" rx="5" ry="1.8"/>
    <ellipse cx="112" cy="174" rx="5" ry="1.8"/>
    <ellipse cx="130" cy="182" rx="4" ry="1.5"/>
  </g>

  <!-- Bioluminescent drifters -->
  <g fill="#5df0c8">
    <circle cx="300" cy="220" r="2.6" opacity="0.9"/>
    <circle cx="330" cy="252" r="1.7" opacity="0.7"/>
    <circle cx="272" cy="248" r="1.4" opacity="0.6"/>
    <circle cx="352" cy="205" r="1.4" opacity="0.55"/>
    <circle cx="60" cy="248" r="1.7" opacity="0.6"/>
  </g>

  <!-- Seafloor dunes -->
  <path d="M0 282 Q60 270 120 280 T240 278 T400 284 L400 300 L0 300 Z" fill="#0d1a14"/>
  <ellipse cx="150" cy="284" rx="10" ry="4" fill="#1c2a22"/>
  <ellipse cx="308" cy="288" rx="7" ry="3" fill="#1c2a22"/>

  <!-- Title -->
  <text x="200" y="165" text-anchor="middle" fill="#bfe3f5" opacity="0.95"
        font-family="Consolas, 'Courier New', monospace" font-size="15" letter-spacing="1.5">
    R/V PELAGIC HORIZON
  </text>
  <text x="200" y="183" text-anchor="middle" fill="#6fa8c4" opacity="0.8"
        font-family="Consolas, 'Courier New', monospace" font-size="9" letter-spacing="2">
    DIVE BENEATH THE HULL
  </text>
</svg>
